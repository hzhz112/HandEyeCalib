[pytest]
# This repo root IS the `calibration` package directory, so the package only
# imports when its *parent* is on sys.path. Hence `pythonpath = ..` and the
# `calibration.tests.*` import style inside tests/. Clone the repo as a
# directory named `calibration/` and run pytest from inside it, or from the
# directory that contains it.
pythonpath = ..

# tests/ (plural) is the real suite. test/ (singular) holds interactive hardware
# scripts that open a camera and enter an infinite loop at import time, with no
# __main__ guard, and `test_charuco_camera.py` would hang the run forever.
testpaths = tests
norecursedirs = test __pycache__ .git

# Connects to the real robot at import time and dereferences the handle. Run it
# directly (`python -m calibration.tests.test_show_information`) instead.
addopts = --ignore=tests/test_show_information.py
